site_name: SURG Documentation
site_description: Smart User Recommendation using GenAI - Documentation
site_author: Shivam Pandey
site_url: https://shivam-pandey-15.github.io/surg/

repo_url: https://github.com/shivam-pandey-15/surg
repo_name: shivam-pandey-15/surg

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - User Guide:
    - Architecture: architecture.md
    - GenAI Layers: genai-layers.md
    - Pipeline: pipeline.md
  - API Reference:
    - Core: api/core.md
    - GenAI: api/genai.md
    - Pipeline: api/pipeline.md
    - Utils: api/utils.md
  - Examples:
    - Basic Usage: examples/basic.md
    - Advanced Pipeline: examples/advanced.md
    - Custom GenAI Layer: examples/custom.md
  - Contributing: contributing.md
  - Changelog: changelog.md