[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surg"
version = "0.1.0"
description = "Smart User Recommendation with GenAI - End-to-end recommendation system enhanced with Generative AI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Shivam Pandey", email = "shivam@example.com"}
]
maintainers = [
    {name = "Shivam Pandey", email = "shivam@example.com"}
]
keywords = [
    "recommendation-system",
    "machine-learning", 
    "artificial-intelligence",
    "generative-ai",
    "openai",
    "embeddings",
    "collaborative-filtering",
    "content-based-filtering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "joblib>=1.1.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "notebook>=6.5.0",
    "ipykernel>=6.15.0",
]
database = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.3.0",
    "redis>=4.5.0",
]
neural = [
    "torch>=2.0.0",
    "transformers>=4.20.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]
visualization = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.14.0",
    "bokeh>=3.0.0",
]
all = [
    "surg[dev,database,neural,visualization]"
]

[project.urls]
"Homepage" = "https://github.com/shivam-pandey-15/surg"
"Bug Reports" = "https://github.com/shivam-pandey-15/surg/issues"
"Source" = "https://github.com/shivam-pandey-15/surg"
"Documentation" = "https://surg.readthedocs.io"

[project.scripts]
surg = "surg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["surg*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
surg = ["py.typed", "*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=surg --cov-report=term-missing"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["surg"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]