[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surg"
version = "0.1.0"
description = "Smart User Recommendation using GenAI - A hybrid recommendation system integrating generative AI with traditional collaborative filtering"
readme = "README.md"
authors = [
    {name = "Shivam Pandey", email = "shivam.pandey@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["recommendation-system", "machine-learning", "generative-ai", "collaborative-filtering", "lightfm"]
requires-python = ">=3.9"

dependencies = [
    # Core ML libraries
    "scikit-surprise>=1.1.3",  # Recommendation algorithms (SVD, KNN, etc.)
    "implicit>=0.7.0",  # Alternative to LightFM for matrix factorization
    "scikit-learn>=1.3.0",
    "numpy>=1.21.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    
    # Deep Learning frameworks (PyTorch with automatic CPU/GPU support)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "torch-geometric>=2.3.0",
    
    # Optimization and training
    "optuna>=3.3.0",
    "hyperopt>=0.2.7",
    "ray[tune]>=2.5.0",
    
    # GenAI libraries
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    
    # Vector databases and embeddings
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "pinecone-client>=2.2.0",
    
    # Data validation and configuration
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    
    # Logging and monitoring
    "loguru>=0.7.0",
    "mlflow>=2.5.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]

api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "redis>=4.6.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
]

gpu = [
    "faiss-gpu>=1.7.0",
]

all = [
    "surg[dev,api,docs]"
]

[project.urls]
Homepage = "https://github.com/shivam-pandey-15/surg"
Documentation = "https://surg.readthedocs.io"
Repository = "https://github.com/shivam-pandey-15/surg"
"Bug Tracker" = "https://github.com/shivam-pandey-15/surg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["surg*"]

[tool.setuptools.package-data]
surg = ["*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=surg",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["surg"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]